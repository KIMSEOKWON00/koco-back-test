# src/main/resources/application.yml
spring:
  profiles:
    # 기본 활성 프로파일: 환경변수 SPRING_PROFILES_ACTIVE가 없으면 dev
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: Koco

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

cloud:
  aws:
    stack:
      auto: false

server:
  address: 0.0.0.0
  port: 8080

logging:
  level:
    root: INFO
  file:
    path: ${LOGGING_FILE_PATH}
    name: ${LOGGING_FILE_NAME}
