# 1) 전체 로그 레벨을 INFO로 낮춰서 잡로그 제거
logging.level.root=INFO

# 2) 내 비즈니스 로직(서비스 레이어)만 DEBUG
logging.level.icet.koco.chatbot=DEBUG

# 3) RestTemplate 사용 시 HTTP 요청·응답 로깅
logging.level.org.springframework.web.client=DEBUG
logging.level.org.apache.http= WARN
# (선택) HTTP 바디까지 보고 싶다면
logging.level.org.apache.http.wire=DEBUG

# 4) WebClient 사용 시 Reactor Netty 로깅
logging.level.reactor.netty.http.client=DEBUG
logging.level.io.netty.handler.logging=DEBUG

# 5) Feign 사용 시 요청·응답 헤더·바디 전부 찍기
feign.client.config.default.loggerLevel=FULL
logging.level.feign.Logger=DEBUG

# 6) Actuator HTTP trace 기능 활성화 (최근 통신 내역 조회용)
management.endpoints.web.exposure.include=health,info,httptrace

# 7) 콘솔 출력 포맷
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
