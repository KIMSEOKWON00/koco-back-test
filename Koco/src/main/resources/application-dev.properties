# 전체 로그 레벨을 DEBUG로 설정
logging.level.root=DEBUG

# Spring 프레임워크 관련 로그
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG

# JPA / Hibernate SQL 및 파라미터 로깅
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG

# 애플리케이션 패키지 로그 (필요시 패키지명으로 조정)
logging.level.com.koco=DEBUG

# 콘솔 로그 포맷 (타임스탬프, 레벨, 스레드, 로거명, 메시지)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# (선택) 파일로도 로그를 남기려면 주석 해제
# logging.file.name=logs/koco-dev.log
